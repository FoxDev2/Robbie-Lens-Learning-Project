<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Accueil - Robbie Lens Photographie</title>
    <link href="styles/style.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles/index.css" title="" type="" />
  </head>

  <body>
    <header>
      <nav>
        <img class="logo" src="images/logo.png" alt="Logo Robbie Lens" />
        <div>
          <a href="index.html">Accueil</a>
          <a href="a-propos.html">À propos</a>
          <a href="portfolio.html">Portfolio</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="section-introduction">
        <div>
          <h1>Robbie Lens Photographie</h1>
          <p>
            Où <em>professionalisme</em> s’allie avec <em>passion</em>. Depuis
            plus de 5 ans maintenant, j’exerce mon métier avec la passion qui
            m’anime : capturer l’essence de chaque instant.
          </p>
          <a href="#form" class="cta">UN PROJET ? ÉCRIVEZ-MOI</a>
        </div>
        <img
          src="images/robbie-lens.png"
          alt="Portrait avec effet de la photographe Robbie Lens"
        />
      </section>
      <section class="section-images">
        <h2>Mon dernier projet</h2>
        <div>
          <img src="images/accueil/element-1.png" alt="photo1" />
          <img src="images/accueil/element-2.png" alt="photo2" />
          <img src="images/accueil/element-3.png" alt="photo3" />
        </div>
        <div>
          <img src="images/accueil/element-4.png" alt="photo4" />
          <img src="images/accueil/element-5.png" alt="photo5" />
          <img src="images/accueil/element-6.png" alt="photo6" />
        </div>
      </section>
      <section class="section-contact">
        <h2>Parlons de votre projet</h2>
        <form id="form" action="" method="get" accept-charset="utf-8">
          
          <div class="identity">
            <div>
              <label for="name">Nom:</label>
              <input type="text" name="name" id="name" value="" />
            </div>
            <div>
              <label for="mail">Adresse E-mail:</label>
              <input type="email" name="email" id="mail" value="" />
            </div>
          </div>
          
          <div>
            <label for="message">Message:</label>
            <textarea name="message" id="message" cols="30" rows="10"></textarea>
          </div>
          
          <div class="submit m">
            <input type="submit" name="submit m" id="envoyer" value="Envoyer" />
          </div>
        </form>
      </section>
    </main>
    <footer>
      <img src="images/logo.png" alt="Logo Robbie Lens" />
      <div>
        <a target="_blank" href="https://twitter.com/" class="lien-icone">
          <img src="images/twitter.png" alt="Logo Twitter" />
        </a>
        <a target="_blank" href="https://www.instagram.com/" class="lien-icone">
          <img src="images/instagram.png" alt="Logo Instagram" />
        </a>
      </div>
    </footer>
  </body>
</html>
